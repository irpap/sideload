<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>sideload</title>
<!-- These must be STATIC: iOS reads them when you tap Add to Home Screen, and the
     document is the same for every #hash, so static markup covers every app.
     Deliberately NO <link rel="manifest">: a manifest's start_url would drop the
     fragment and launch the bare compiler instead of your app. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="sideload">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0e12">
<meta name="color-scheme" content="dark light">
<link rel="apple-touch-icon" href="icon.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0c0e12; --panel:#14171d; --panel2:#1a1e26; --line:#262b35;
  --fg:#e7eaf0; --dim:#9aa3b2; --faint:#6b7483;
  --accent:#5b9dff; --accent-fg:#06203f;
  --ok:#3fcf8e; --warn:#f0b429; --bad:#ff6b6b;
  --radius:12px;
  font-synthesis-weight:none;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dfe3ea;
        --fg:#121620;--dim:#5a6372;--faint:#8b94a3;--accent:#1f6feb;--accent-fg:#fff}
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
/* ---------- compiler ---------- */
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 64px}
header{margin:6px 0 22px}
h1{font-size:21px;margin:0;letter-spacing:-.3px;font-weight:650}
h1 .hash{color:var(--accent)}
.tag{color:var(--dim);font-size:13.5px;margin-top:5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:14px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:0 0 11px;font-weight:650}
label{display:block;font-size:12.5px;color:var(--dim);margin:11px 0 5px}
label:first-child{margin-top:0}
textarea,input[type=text]{
  width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:9px;padding:10px 11px;font-size:14px;font-family:inherit
}
textarea{min-height:124px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.45}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.drop{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 180px;min-width:0}
.btn{
  -webkit-appearance:none;appearance:none;border:1px solid var(--line);background:var(--panel2);
  color:var(--fg);border-radius:9px;padding:10px 14px;font-size:14px;font-weight:550;
  cursor:pointer;font-family:inherit;white-space:nowrap
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:6px 10px;font-size:12.5px;font-weight:500}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary:disabled{background:var(--panel2);border-color:var(--line);color:var(--dim)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
/* meter */
.meter{margin-top:4px}
.bar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok);transition:width .18s ease,background .18s ease}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.nums{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.nums b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--faint);margin-top:9px}
.hint code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:11.5px}
/* checks */
.chk{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.chk:first-of-type{border-top:0}
.chk .ico{flex:0 0 16px;text-align:center;line-height:1.35}
.chk .ico.ok{color:var(--ok)} .chk .ico.warn{color:var(--warn)} .chk .ico.info{color:var(--accent)}
.chk div{min-width:0}
.chk b{font-weight:600}
.chk span{color:var(--dim);display:block;font-size:12.5px;margin-top:1px;overflow-wrap:anywhere}
/* apps */
.app{display:flex;gap:11px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.app:first-of-type{border-top:0}
.app img{width:34px;height:34px;border-radius:8px;flex:0 0 auto;display:block}
.app .meta{flex:1;min-width:0}
.app .meta b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .meta span{font-size:11.5px;color:var(--faint)}
.empty{color:var(--faint);font-size:13px;padding:2px 0}
details{margin-top:4px}
summary{cursor:pointer;font-size:13px;color:var(--dim);padding:4px 0}
details p,details li{font-size:13px;color:var(--dim);line-height:1.6}
details ul{padding-left:19px;margin:8px 0}
.sw{display:flex;align-items:flex-start;gap:9px;margin-top:13px;font-size:13px;color:var(--fg)}
.sw input{width:17px;height:17px;accent-color:var(--accent);flex:0 0 auto;margin:0}
.sw span{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.sw input{margin-top:2px}
.sw label{display:block;margin:0}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;
  font-weight:550;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw
}
.toast.on{opacity:1}
/* error overlay (runner) */
#errs{position:fixed;left:0;right:0;bottom:0;z-index:2147483647;pointer-events:none;
      padding:0 8px calc(8px + env(safe-area-inset-bottom));
      font:13px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.note{
  pointer-events:auto;background:#1b1f27;color:#f2f4f8;border:1px solid #333a46;
  border-left:3px solid var(--warn);border-radius:10px;padding:10px 12px;margin-top:7px;
  box-shadow:0 8px 28px rgba(0,0,0,.45);display:flex;gap:10px;align-items:flex-start
}
.note.err{border-left-color:var(--bad)}
.note .body{flex:1;min-width:0}
.note b{display:block;font-size:13px;margin-bottom:2px}
.note p{margin:0;color:#aeb6c4;font-size:12px;overflow-wrap:anywhere}
.note pre{margin:5px 0 0;font:11px/1.4 ui-monospace,Menlo,monospace;color:#8e97a6;
          white-space:pre-wrap;max-height:88px;overflow:auto}
.note button{-webkit-appearance:none;appearance:none;background:#2a303b;border:0;color:#cfd6e2;
             border-radius:6px;padding:4px 8px;font-size:11.5px;cursor:pointer;font-family:inherit}
.note .x{background:transparent;color:#7d8696;font-size:17px;line-height:1;padding:0 2px}
.fatal{max-width:560px;margin:14vh auto 0;padding:0 20px;text-align:left}
.fatal h2{font-size:17px;margin:0 0 9px}
.fatal p{color:var(--dim);font-size:14px}
.fatal pre{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px;
           font-size:11.5px;color:var(--dim);white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
'use strict';

/* ====================================================================== *
 * sideload — run a single-file HTML app straight out of a URL fragment.
 * Everything is client-side. The fragment never reaches a server.
 * ====================================================================== */

var NS_PREFIX = '__sideload__';          /* app data:  __sideload__<slug>:<key>   */
var SELF_NS   = '__sideload$self:';      /* own state: '$' can't occur in a slug  */
var BUDGET    = 64000;                   /* conservative URL ceiling for Safari   */
var VERSION   = '2';
var MAX_RECENT= 24;

/* =====================================================================
 * INSTANCE PUBLIC KEY  --  replace this with your own. See the README.
 *
 * This engine will ONLY run app links signed by the matching private key.
 * Leave it blank and nothing will run until you configure it.
 *
 * Keep this in the engine, never in the payload. If the payload carried its
 * own public key, anyone could sign with their own key and the check would
 * pass, which would make it useless.
 * ===================================================================== */
var PUBLIC_KEY = 'BJ6EgtekXW_zKTVkBa9aWd9YdUi9S84xBBzKRI202KH9HZyh0Kj2U6jfRTuFaUxuvAHUruk_0yhkfWQ7MsWkKrM';

var te = new TextEncoder(), td = new TextDecoder();
var $ = function(id){ return document.getElementById(id); };

/* ---------------------------------------------------------------- codec */
function gzipStr(str){
  var cs = new CompressionStream('gzip');
  var w = cs.writable.getWriter();
  w.write(te.encode(str)); w.close();
  return new Response(cs.readable).arrayBuffer().then(function(b){ return new Uint8Array(b); });
}
function gunzipBytes(bytes){
  var ds = new DecompressionStream('gzip');
  var w = ds.writable.getWriter();
  w.write(bytes); w.close();
  return new Response(ds.readable).arrayBuffer().then(function(b){ return td.decode(b); });
}
function toB64url(bytes){
  var bin='', C=0x8000;
  for(var i=0;i<bytes.length;i+=C) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+C));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function fromB64url(s){
  var b64=s.replace(/-/g,'+').replace(/_/g,'/');
  if(b64.length%4) b64 += new Array(5-(b64.length%4)).join('=');
  var bin=atob(b64), out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
/* ---------------------------------------------------------------- crypto */
var EC     = {name:'ECDSA', namedCurve:'P-256'};
var SIGALG = {name:'ECDSA', hash:'SHA-256'};

function haveCrypto(){
  return !!(window.crypto && crypto.subtle && typeof crypto.subtle.sign==='function');
}
function importPublic(b64){
  return crypto.subtle.importKey('raw', fromB64url(b64), EC, true, ['verify']);
}
function importPrivate(b64){
  return crypto.subtle.importKey('pkcs8', fromB64url(b64), EC, true, ['sign']);
}
function genKeyPair(){ return crypto.subtle.generateKey(EC, true, ['sign','verify']); }
function exportPublicRaw(key){
  return crypto.subtle.exportKey('raw', key).then(function(b){ return toB64url(new Uint8Array(b)); });
}
function exportPrivatePkcs8(key){
  return crypto.subtle.exportKey('pkcs8', key).then(function(b){ return toB64url(new Uint8Array(b)); });
}
/* Web Crypto cannot export a public key from a private one. A JWK export of a
   P-256 private key does include x and y, so rebuild the raw point from those. */
function publicFromPrivate(b64priv){
  return importPrivate(b64priv)
    .then(function(k){ return crypto.subtle.exportKey('jwk', k); })
    .then(function(jwk){
      var x=fromB64url(jwk.x), y=fromB64url(jwk.y), raw=new Uint8Array(65);
      raw[0]=4; raw.set(x,1); raw.set(y,33);
      return toB64url(raw);
    });
}

/* ---- signing key for this device (compiler side) ---- */
function storedKey(){ var v=selfGet('key',null); return typeof v==='string'?v:null; }
function storeKey(b64){ selfSet('key', b64); }
function forgetStoredKey(){ try{ localStorage.removeItem(SELF_NS+'key'); }catch(e){} }

/* ------------------------------------------------- payload: sign and verify
 * Format:  <version>-<base64url signature>.<base64url gzip(json)>
 * The signature covers the exact gzip bytes that get decompressed, so what
 * was signed and what runs are the same bytes.                            */
function encodeSigned(meta, privB64){
  return gzipStr(JSON.stringify(meta)).then(function(bytes){
    return importPrivate(privB64).then(function(k){
      return crypto.subtle.sign(SIGALG, k, bytes).then(function(sig){
        return VERSION+'-'+toB64url(new Uint8Array(sig))+'.'+toB64url(bytes);
      });
    });
  });
}
function decodeVerified(payload){
  return Promise.resolve().then(function(){
    var dash = payload.indexOf('-');
    if(dash < 0) throw new Error('Malformed link: no version prefix.');
    var v = payload.slice(0, dash);
    if(v !== VERSION)
      throw new Error('This link uses sideload format "'+v+'", but this site reads format "'+VERSION+'".');
    var rest = payload.slice(dash+1), dot = rest.indexOf('.');
    if(dot < 0) throw new Error('Malformed link: missing signature.');
    if(!PUBLIC_KEY) throw new Error('UNCONFIGURED');

    var sig, bytes;
    try{ sig = fromB64url(rest.slice(0,dot)); bytes = fromB64url(rest.slice(dot+1)); }
    catch(e){ throw new Error('Malformed link: could not decode.'); }

    /* Verify before decompressing. Nothing is unpacked or rendered unless
       this check passes. */
    return importPublic(PUBLIC_KEY)
      .then(function(pub){ return crypto.subtle.verify(SIGALG, pub, sig, bytes); })
      .then(function(good){
        if(!good) throw new Error('BADSIG');
        return gunzipBytes(bytes).then(JSON.parse);
      });
  });
}

/* ------------------------------------------------------------- utilities */
function slugify(s){
  return String(s||'').toLowerCase().normalize('NFKD')
    .replace(/[^a-z0-9\s-]/g,'').trim()
    .replace(/[\s_]+/g,'-').replace(/-+/g,'-').replace(/^-+|-+$/g,'')
    .slice(0,48) || 'app';
}
function hashStr(s){
  var h=2166136261;
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}
function initials(t){
  var w=String(t||'').trim().split(/\s+/).filter(Boolean);
  if(!w.length) return '?';
  if(w.length===1) return w[0].slice(0,2).toUpperCase();
  return (w[0][0]+w[1][0]).toUpperCase();
}
function makeIcon(title,slug,size){
  size = size||180;
  var c=document.createElement('canvas'); c.width=c.height=size;
  var g=c.getContext('2d'), hue=hashStr(slug)%360;
  var grd=g.createLinearGradient(0,0,size,size);
  grd.addColorStop(0,'hsl('+hue+',56%,54%)');
  grd.addColorStop(1,'hsl('+((hue+42)%360)+',60%,36%)');
  g.fillStyle=grd; g.fillRect(0,0,size,size);
  g.fillStyle='rgba(255,255,255,.96)';
  g.font='700 '+Math.round(size*0.4)+'px -apple-system,system-ui,"Helvetica Neue",sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(initials(title), size/2, size*0.545);
  return c.toDataURL('image/png');
}
function fmtBytes(n){
  if(n<1024) return n+' B';
  return (n/1024).toFixed(n<10240?1:0)+' KB';
}
function fmtNum(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function baseUrl(){ return location.origin + location.pathname; }
function guessTitle(html){
  var m=/<title[^>]*>([\s\S]*?)<\/title>/i.exec(html||'');
  return m ? m[1].replace(/\s+/g,' ').trim() : '';
}
function download(name, text, mime){
  var b=new Blob([text],{type:mime||'text/plain'}), u=URL.createObjectURL(b);
  var a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(u); },4000);
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('on'); });
  setTimeout(function(){ t.classList.remove('on'); setTimeout(function(){ t.remove(); },260); },1900);
}

/* ------------------------------------------------------- own persistence */
function selfGet(k,dflt){
  try{ var v=localStorage.getItem(SELF_NS+k); return v==null?dflt:JSON.parse(v); }
  catch(e){ return dflt; }
}
function selfSet(k,v){ try{ localStorage.setItem(SELF_NS+k, JSON.stringify(v)); }catch(e){} }
function readApps(){ var a=selfGet('apps',[]); return Array.isArray(a)?a:[]; }
function recordApp(meta,payload){
  var apps=readApps().filter(function(a){ return a.slug!==meta.slug; });
  apps.unshift({title:meta.title, slug:meta.slug, payload:payload, ts:Date.now()});
  selfSet('apps', apps.slice(0,MAX_RECENT));
}

/* ====================================================================== *
 * Injected as the first script inside the app's <head>, so it runs before
 * any app code. It namespaces storage, shows errors, and can stand in for
 * the Claude artifact runtime.
 * ====================================================================== */
var PRELUDE_BODY = `
var NS = CFG.ns;
var PAYLOAD = location.hash.replace(/^#/,'');

/* --- namespaced Storage ----------------------------------------------- */
function wrap(real){
  function mine(){
    var out=[];
    for(var i=0;i<real.length;i++){
      var k=real.key(i);
      if(k && k.lastIndexOf(NS,0)===0) out.push(k);
    }
    return out;
  }
  var api={
    getItem:function(k){ return real.getItem(NS+k); },
    setItem:function(k,v){ real.setItem(NS+k,String(v)); },
    removeItem:function(k){ real.removeItem(NS+k); },
    clear:function(){ mine().forEach(function(k){ real.removeItem(k); }); },
    key:function(i){ var m=mine()[i]; return m===undefined?null:m.slice(NS.length); }
  };
  return new Proxy({},{
    get:function(t,p){
      if(p==='length') return mine().length;
      if(Object.prototype.hasOwnProperty.call(api,p)) return api[p];
      if(typeof p==='symbol') return undefined;
      return real.getItem(NS+p);
    },
    set:function(t,p,v){ real.setItem(NS+p,String(v)); return true; },
    has:function(t,p){ return Object.prototype.hasOwnProperty.call(api,p) || real.getItem(NS+p)!==null; },
    deleteProperty:function(t,p){ real.removeItem(NS+p); return true; },
    ownKeys:function(){ return mine().map(function(k){ return k.slice(NS.length); }); },
    getOwnPropertyDescriptor:function(t,p){
      var v=real.getItem(NS+p);
      if(v===null) return undefined;
      return {value:v,writable:true,enumerable:true,configurable:true};
    }
  });
}

var installed=[];
['localStorage','sessionStorage'].forEach(function(name){
  var real;
  try{ real=window[name]; if(!real) return; real.length; }
  catch(e){
    note('err','Storage blocked', name+' is unavailable: '+String(e&&e.message||e)+
         '. Nothing this app saves will persist.');
    return;
  }
  var proxy=wrap(real), ok=false;
  try{
    Object.defineProperty(window,name,{value:proxy,configurable:true,writable:true});
    ok = window[name]===proxy;
  }catch(e){}
  if(!ok){ try{ delete window[name]; window[name]=proxy; ok=window[name]===proxy; }catch(e){} }
  if(ok) installed.push(name);
  else note('err','Storage isolation failed', name+' could not be namespaced, so this app '+
            'may read or overwrite another sideloaded app data.');
});

/* --- Claude artifact-runtime stand-in --------------------------------- */
if(CFG.claudeShim && !window.claude){
  var mkDoc=function(path){
    var k='__claudedb__:'+path;
    function read(){
      try{ var s=window.localStorage.getItem(k); return s==null?null:JSON.parse(s); }
      catch(e){ return null; }
    }
    function write(o){ window.localStorage.setItem(k,JSON.stringify(o)); }
    return {
      path:path,
      get:function(){ return Promise.resolve().then(function(){
        var v=read();
        return { exists:v!==null, id:path.split('/').pop(), data:function(){ return v; } };
      }); },
      set:function(o){ return Promise.resolve().then(function(){ write(o); }); },
      update:function(o){ return Promise.resolve().then(function(){
        var cur=read()||{};
        Object.keys(o).forEach(function(kk){ cur[kk]=o[kk]; });
        write(cur);
      }); },
      delete:function(){ return Promise.resolve().then(function(){
        window.localStorage.removeItem(k);
      }); }
    };
  };
  var mkColl=function(p){
    return {
      doc:function(id){ return mkDoc(p+'/'+id); },
      list:function(){ return Promise.resolve({docs:[]}); },
      query:function(){ return Promise.resolve({docs:[]}); }
    };
  };
  window.claude={
    __sideload:true,
    use:function(name){ return Promise.resolve().then(function(){
      if(name==='db')   return { doc:mkDoc, collection:mkColl };
      if(name==='user') return { id:function(){ return Promise.resolve('sideload-device'); },
                                 name:function(){ return Promise.resolve('This device'); } };
      return null;
    }); }
  };
}

/* --- show failures instead of leaving a blank screen ------------------ */
var OV_CSS = ''
 + '.box{padding:0 8px calc(8px + env(safe-area-inset-bottom));'
 + 'font:13px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}'
 + '.n{pointer-events:auto;background:#1b1f27;color:#f2f4f8;border:1px solid #333a46;'
 + 'border-left:3px solid #f0b429;border-radius:10px;padding:10px 12px;margin-top:7px;'
 + 'box-shadow:0 8px 28px rgba(0,0,0,.45);display:flex;gap:10px;align-items:flex-start}'
 + '.n.err{border-left-color:#ff6b6b}'
 + '.n .b{flex:1;min-width:0}'
 + '.n b{display:block;font-size:13px;margin-bottom:2px}'
 + '.n p{margin:0;color:#aeb6c4;font-size:12px;overflow-wrap:anywhere}'
 + '.n pre{margin:6px 0 0;font:11px/1.4 ui-monospace,Menlo,monospace;color:#8e97a6;'
 + 'white-space:pre-wrap;max-height:160px;overflow:auto}'
 + '.n .b{cursor:pointer}'
 + '.n .more{margin-top:5px;font-size:11px;color:#8e97a6;text-decoration:underline}'
 + '.n .cp{margin-top:7px;-webkit-appearance:none;appearance:none;background:#2a303b;'

var ovBox=null, pending=[], seenErr={}, resHosts=[], resUrls=[], resNode=null;

function ensureBox(){
  if(ovBox) return ovBox;
  if(!document.body) return null;
  var host=document.createElement('div');
  host.setAttribute('data-sideload','notes');
  host.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:2147483647;pointer-events:none';
  document.body.appendChild(host);
  /* Use a shadow root so the app's CSS cannot restyle or hide these. */
  var sr=host.attachShadow({mode:'open'});
  sr.innerHTML='<style>'+OV_CSS+'</style><div class="box"></div>';
  ovBox=sr.querySelector('.box');

function paint(item){
  var box=ensureBox(); if(!box) return null;
  var n=document.createElement('div');
  n.className='n'+(item.kind==='err'?' err':'');
  n.innerHTML='<div class="b"><b></b><p></p>'+
    (item.detail ? '<div class="more">Tap for details</div><pre hidden></pre>'+
                   '<button class="cp" hidden>Copy details</button>' : '')+
    '</div><button class="x" aria-label="Dismiss">&times;</button>';
  n.querySelector('b').textContent=item.t;
  n.querySelector('p').textContent=item.m;
  n.querySelector('.x').onclick=function(ev){ ev.stopPropagation(); n.remove(); };

  if(item.detail){
    var pre=n.querySelector('pre'), cp=n.querySelector('.cp'), more=n.querySelector('.more');
    pre.textContent=item.detail;
    n.querySelector('.b').onclick=function(){
      var open = !pre.hidden;
      pre.hidden=open; cp.hidden=open;
      more.textContent = open ? 'Tap for details' : 'Tap to hide';
    };
    cp.onclick=function(ev){
      ev.stopPropagation();
      var txt=item.t+': '+item.m+'\n'+item.detail;
      if(navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(txt).then(function(){
          cp.textContent='Copied'; setTimeout(function(){ cp.textContent='Copy details'; },1600);
        }).catch(function(){ cp.textContent='Select the text above'; });
      else cp.textContent='Select the text above';
    };
  }
  box.appendChild(n);
  return n;
}
function flush(){
  if(!document.body) return;
  while(pending.length){ var it=pending.shift(); var el=paint(it); if(it.after) it.after(el); }
}
function note(kind,t,m,detail,after){
  pending.push({kind:kind,t:t,m:m,detail:detail,after:after});
  flush();
}
document.addEventListener('DOMContentLoaded',flush);
window.addEventListener('load',flush);

window.addEventListener('error',function(e){
  var t=e.target;
  if(t && t!==window && (t.src||t.href)){
    var u=String(t.src||t.href), h;
    try{ h=new URL(u,location.href).host; }catch(_){ h=u; }
    if(resHosts.indexOf(h)<0) resHosts.push(h);
    var msg=resHosts.join(', ')+' could not be reached, so fonts or styles may look wrong. '+
            'This app needs a network connection for them.';
    resUrls.push(u);
    if(resNode){
      var pp=resNode.querySelector('p'); if(pp) pp.textContent=msg;
      var rp=resNode.querySelector('pre'); if(rp) rp.textContent=resUrls.join('\n');
    }
    else note('','Offline resources',msg,resUrls.join('\n'),function(el){ resNode=el; });
    return;
  }
  /* Not an ErrorEvent at all: a failed resource whose element had no src or
     href. Nothing useful to report, and it is not a script error. */
  if(e.message===undefined && e.lineno===undefined && e.filename===undefined){
    try{ console.warn('[sideload] resource failed, no URL available', e.target); }catch(_){}
    return;
  }

  var msg=String(e.message||'');

  /* "Script error." is all a browser will say when the failing script came
     from another site. If this app loads no outside scripts, the error cannot
     be the app's -- it is almost always a browser extension, which injects
     scripts into the page and can trip over document.write replacing the
     document underneath it. Reporting it would be a false alarm. */
  if(msg==='Script error.' && !CFG.extScripts){
    try{ console.warn('[sideload] ignoring a cross-origin "Script error." - this app '+
                      'loads no external scripts, so it is not from the app '+
                      '(most likely a browser extension).'); }catch(_){}
    return;
  }

  var key=msg+'@'+e.lineno+':'+e.colno;
  if(seenErr[key]) return; seenErr[key]=1;
  var where=e.lineno?(' (line '+e.lineno+(e.colno?', col '+e.colno:'')+')'):'';
  var kind='err', title='App error';

  if(!msg) msg='The browser reported an error but gave no message.';
  else if(msg==='Script error.'){
    kind=''; title='Error in an external script';
    msg='One of the outside scripts this app loads threw an error. Browsers hide the '+
        'details for scripts from another site, so there is nothing more to show.';
  }
  var d=[];
  d.push('message: '+(e.message||'(none)'));
  if(e.filename) d.push('source:  '+e.filename);
  if(e.lineno)   d.push('line:    '+e.lineno+(e.colno?':'+e.colno:''));
  if(e.error && e.error.name) d.push('type:    '+e.error.name);
  d.push('app:     '+CFG.slug);
  if(e.error && e.error.stack) d.push('\n'+String(e.error.stack).slice(0,900));
  note(kind,title, msg+where, d.join('\n'));
},true);

window.addEventListener('unhandledrejection',function(e){
  var r=e.reason;
  var key='rej:'+String(r&&r.message||r);
  if(seenErr[key]) return; seenErr[key]=1;
  var d=['message: '+String((r&&r.message)||r)];
  if(r && r.name) d.push('type:    '+r.name);
  d.push('app:     '+CFG.slug);
  if(r && r.stack) d.push('\n'+String(r.stack).slice(0,900));
  note('err','Unhandled promise rejection', String((r&&r.message)||r), d.join('\n'));
});

/* --- navigation guards ------------------------------------------------ */
document.addEventListener('click',function(e){
  var n=e.target;
  var a=(n && n.closest) ? n.closest('a[href]') : null;
  if(!a) return;
  var h=a.getAttribute('href')||'';
  if(/^https?:/i.test(h)){
    /* Navigating away would discard the app, because it only exists in this URL. */
    if(!a.target){ a.target='_blank'; a.rel='noopener noreferrer'; }
    return;
  }
  if(h.charAt(0)==='#'){
    /* A link to #something would replace the payload and lose the app, so
       scroll to the target instead of letting the # change. */
    e.preventDefault();
    var id=h.slice(1);
    if(!id){ window.scrollTo(0,0); return; }
    var t=document.getElementById(id)||document.getElementsByName(id)[0];
    if(t && t.scrollIntoView) t.scrollIntoView({behavior:'smooth',block:'start'});
  }
},true);

/* Fallback: if something changed the # anyway, put the payload back. */
if(PAYLOAD){
  window.addEventListener('hashchange',function(){
    if(location.hash.replace(/^#/,'')!==PAYLOAD){
      try{ history.replaceState(null,'','#'+PAYLOAD); }catch(e){}
    }
  });
}

/* Without this, dragging a range input sideways scrolls the page and the
   value never changes. Added late so it takes effect over the app's own CSS at
   equal specificity. No !important, so an app that sets touch-action wins. */
(function(){
  function addFix(){
    if(!document.head && !document.body) return;
    var st=document.createElement('style');
    st.setAttribute('data-sideload','touch');
    st.textContent='input[type=range]{touch-action:none}';
    (document.head||document.body).appendChild(st);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',addFix);
  else addFix();
})();

function buildPrelude(slug, opts){
  var cfg = JSON.stringify({
    ns: NS_PREFIX + slug + ':',
    slug: slug,
    origin: location.origin,
    claudeShim: !!opts.claudeShim,
    extScripts: !!opts.extScripts
  });
  return '<scr'+'ipt>(function(){var CFG='+cfg+';\n'+PRELUDE_BODY+'\n})();<\/scr'+'ipt>';
}

/* Insert the prelude as early as legally possible without breaking doctype. */
function injectPrelude(html, script){
  var pats=[/<head[^>]*>/i, /<html[^>]*>/i, /<!doctype[^>]*>/i];
  for(var i=0;i<pats.length;i++){
    var m=pats[i].exec(html);
    if(m){ var at=m.index+m[0].length; return html.slice(0,at)+script+html.slice(at); }
  }
  return script+html;
}

/* -------------------------------------------------------------- analysis */
function analyze(html){
  html = html||'';
  var ext=[], m, re=/(?:src|href)\s*=\s*["'](https?:\/\/[^"']+)["']/gi;
  while((m=re.exec(html))) ext.push(m[1]);
  /* Scripts are tracked on their own: only a cross-origin SCRIPT can produce
     the browser's opaque "Script error.", so this decides whether such an
     error could possibly have come from this app. */
  var extScripts=[], rs=/<script[^>]+src\s*=\s*["'](https?:\/\/[^"']+)["']/gi;
  while((m=rs.exec(html))) extScripts.push(m[1]);
  /* A script element built at runtime counts too. */
  if(/\.src\s*=\s*["'`]https?:/i.test(html) ||
     /createElement\s*\(\s*["']script["']\s*\)/i.test(html)) extScripts.push('(built at runtime)');
  var re2=/@import\s+(?:url\()?\s*["']?(https?:\/\/[^"')\s]+)/gi;
  while((m=re2.exec(html))) ext.push(m[1]);
  var hosts={}, order=[];
  ext.forEach(function(u){
    var h; try{ h=new URL(u).host; }catch(e){ h=u; }
    if(!hosts[h]){ hosts[h]=0; order.push(h); }
    hosts[h]++;
  });
  return {
    hosts: order, hostCount: hosts, extCount: ext.length,
    extScripts: extScripts,
    storage: /\b(?:local|session)Storage\b/.test(html),
    claude:  /\bwindow\.claude\b|\bclaude\s*\.\s*use\s*\(/.test(html),
    modules: /type\s*=\s*["']module["']/i.test(html),
    dataImgs:(html.match(/data:image\/[a-z+.-]+;base64/gi)||[]).length
  };
}

 * RUNNER

function fatal(title, detail){
  document.body.className='';
  $('root').innerHTML =
    '<div class="fatal"><h2>'+esc(title)+'</h2>'+
    '<p>'+esc(detail||'')+'</p>'+
    '<p><a class="btn" href="'+esc(baseUrl())+'">Open the compiler</a></p></div>';
}

function runApp(payload){
  decodeVerified(payload).then(function(meta){
    if(!meta || typeof meta.html!=='string') throw new Error('Payload decoded but contained no app HTML.');

    var title = (meta.title||'').trim() || guessTitle(meta.html) || 'app';
    var slug  = meta.slug || slugify(title);
    var icon=''; try{ icon = makeIcon(title,slug); }catch(e){}

    try{ recordApp({title:title,slug:slug}, payload); }catch(e){}

    /* iOS reads these when you tap Add to Home Screen, and it reads them from
       the document on screen. document.write replaces our own <head>, so put
       them into the app's HTML instead. */
    var hasExtScripts = false;
    try{ hasExtScripts = analyze(meta.html).extScripts.length > 0; }catch(e){}

    var inject = buildPrelude(slug,{claudeShim: meta.claudeShim!==false, extScripts: hasExtScripts})
      + '<meta name="apple-mobile-web-app-capable" content="yes">'
      + '<meta name="mobile-web-app-capable" content="yes">'
      + '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">'
      + '<meta name="apple-mobile-web-app-title" content="'+esc(title)+'">'
      + (icon ? '<link rel="apple-touch-icon" sizes="180x180" href="'+icon+'">' : '')
      + (guessTitle(meta.html) ? '' : '<title>'+esc(title)+'</title>');

    var doc = injectPrelude(meta.html, inject);

    /* Replace this page with the app. There is no iframe, so no second
       scrollable layer: touch, scrolling, viewport units and safe-area insets
       all behave normally, and dragging a slider does not scroll the page.
       The address stays the same, so storage keeps working and Add to Home
       Screen still captures the payload. */
    document.title = title;
    document.open();
    document.write(doc);
    document.close();

  }).catch(function(err){
    var m = (err && err.message) || String(err);

    if(m === 'BADSIG'){
      fatal('Refused: this link is not signed by your key',
        'This site only runs apps signed with your own private key. This link was not \u2014 it may have been '+
        'altered, built on someone else\u2019s site, or made by someone after your saved data. '+
        'Nothing in it has been run.');
      return;
    }
    if(m === 'UNCONFIGURED'){
      fatal('This site has no signing key',
        'No public key is set, so nothing can be verified and nothing will run. Open the compiler, '+
        'create a key, and follow the setup steps in the README.');
      return;
    }
    var extra='';
    if(payload.length>=BUDGET-200)
      extra=' The link is '+fmtNum(payload.length)+' characters, right at the limit \u2014 it may have been truncated when it was saved or shared.';
    fatal('Could not open this link', m+extra);
  });
}

function renderMeter(){
  var bar=$('bar'), fill=bar.firstChild, nums=$('nums'), hint=$('fitHint');
  if(!state.url){
    bar.className='bar'; fill.style.width='0';
    nums.innerHTML='<span>Paste something to measure it.</span>';
    hint.textContent='';
    return;
  }
  var chars=state.url.length, pct=Math.min(100, chars/BUDGET*100);
  bar.className='bar'+(pct>100?' bad':pct>80?' warn':'');
  fill.style.width=Math.max(1.5,pct)+'%';
  nums.innerHTML=
    '<span>HTML <b>'+fmtBytes(state.raw)+'</b></span>'+
    '<span>gzipped <b>'+fmtBytes(state.gz)+'</b></span>'+
    '<span>URL <b>'+fmtNum(chars)+'</b> chars</span>'+
    '<span><b>'+pct.toFixed(1)+'%</b> of budget</span>';
  if(chars>BUDGET){
    hint.innerHTML='<b style="color:var(--bad)">Over budget by '+fmtNum(chars-BUDGET)+' characters.</b> '+
      'Safari may cut this link short, and it would then break after you bookmark it. '+
      'Remove any embedded images or large blocks of data, or host this one as a normal web page.';
  }else if(pct>80){
    hint.textContent='Close to the limit. It will work, but there is not much room to add to the app later.';
  }else{
    hint.textContent='Plenty of room.';
  }
}

function renderChecks(html){
  var box=$('checks');
  if(!html || !html.trim()){ box.innerHTML=''; return; }
  var a=analyze(html), rows=[];
  function row(ico,cls,title,body){
    rows.push('<div class="chk"><div class="ico '+cls+'">'+ico+'</div><div><b>'+title+'</b>'+
              (body?'<span>'+body+'</span>':'')+'</div></div>');
  }
  if(a.hosts.length){
    row('!','warn', a.hosts.length+' external host'+(a.hosts.length>1?'s':''),
      esc(a.hosts.join(', '))+' &mdash; fine online, but these fail in Airplane Mode. If a font or '+
      'stylesheet does not load the app still works but looks wrong. If a script does not load it usually will not run.');
  }else{
    row('✓','ok','Fully self-contained','No external requests. Works offline.');
  }
  if(a.storage) row('\u2713','ok','Saves data','Stored under this app\u2019s own key, separate from your other apps.');
  if(a.claude)  row('i','info','Built for claude.ai storage',
    'This app saves through <code>window.claude</code>, which only exists on claude.ai. sideload replaces it '+
    'automatically so the app saves to this device instead. Data already in your Claude account stays there.');
  if(a.dataImgs) row('!','warn', a.dataImgs+' embedded image'+(a.dataImgs>1?'s':''),
    'A base64 image is usually larger than the whole URL limit on its own. Removing them frees the most space.');
  box.innerHTML=rows.join('');
}

function renderApps(){
  var box=$('apps'), apps=readApps();
  if(!apps.length){ box.innerHTML='<div class="empty">Nothing yet. Apps you compile or open show up here.</div>'; return; }
  box.innerHTML=apps.map(function(a,i){
    var when=new Date(a.ts||0);
    return '<div class="app">'+
      '<img src="'+makeIcon(a.title,a.slug,68)+'" alt="">'+
      '<div class="meta"><b>'+esc(a.title)+'</b>'+
        '<span>'+esc(a.slug)+' &middot; '+(isFinite(when)?when.toLocaleDateString():'')+'</span></div>'+
      '<button class="btn sm" data-open="'+i+'">Open</button>'+
      '<button class="btn sm" data-load="'+i+'">Edit</button>'+
      '<button class="btn sm" data-del="'+i+'">&times;</button>'+
    '</div>';
  }).join('');

  box.onclick=function(e){
    var b=e.target.closest && e.target.closest('button'); if(!b) return;
    var apps=readApps();
    if(b.dataset.open!=null){ location.href=baseUrl()+'#'+apps[+b.dataset.open].payload; }
    else if(b.dataset.load!=null){
      var a=apps[+b.dataset.load];
      decodeVerified(a.payload).then(function(m){
        $('src').value=m.html; $('title').value=m.title||''; $('slug').value=m.slug||'';
        recompute(); window.scrollTo(0,0); toast('Loaded into the editor');
      }).catch(function(err){ toast('Could not decode that entry'); });
    }
    else if(b.dataset.del!=null){
      var idx=+b.dataset.del, a=apps[idx];
      if(!confirm('Remove "'+a.title+'" from this list?\n\nIts saved data is kept — recompiling with the storage key "'+a.slug+'" will find it again.')) return;
      apps.splice(idx,1); selfSet('apps',apps); renderApps();
    }
  };
}

function renderDataHint(){
  var n=0, bytes=0;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);

    }
  }catch(e){}
  $('dataHint').textContent = n
    ? n+' saved value'+(n>1?'s':'')+' across your apps, about '+fmtBytes(bytes*2)+'. Export writes a JSON file you can import on another device.'
    : 'No app data stored yet.';
}

var recomputeTimer=null;
function scheduleRecompute(){ clearTimeout(recomputeTimer); recomputeTimer=setTimeout(recompute,160); }

function recompute(){
  var html=$('src').value;
  var autoTitle=guessTitle(html);
  if(!$('title').value.trim() && autoTitle) $('title').value=autoTitle;
  var title=$('title').value.trim()||autoTitle||'';
  if(!$('slug').dataset.touched) $('slug').value = title ? slugify(title) : '';
  var slug=slugify($('slug').value||title);

  renderChecks(html);

  if(!html.trim()){
    state={payload:null,url:null,raw:0,gz:0};
    renderMeter(); setActions(false);
    return;
  }
  var meta={v:1, title:title||'Untitled app', slug:slug, html:html, claudeShim:true};
  var raw=te.encode(html).length;
  var priv=storedKey();
  if(!priv || !haveCrypto()){
    /* No key on this device. Still show the size and allow download, but
       do not produce a link. */
    gzipStr(JSON.stringify(meta)).then(function(bytes){
      if($('src').value!==html) return;
      state={payload:null, url:null, raw:raw, gz:bytes.length, meta:meta};
      state.url=baseUrl()+'#'+VERSION+'-'+'x'.repeat(86)+'.'+toB64url(bytes);  /* size estimate only */
      state.payload=null;
      renderMeter(); setActions(false);
      $('fitHint').textContent='Size only \u2014 import your signing key to publish.';
    });
    return;
  }
  encodeSigned(meta, priv).then(function(payload){
    if($('src').value!==html) return;              /* stale */
    state.payload=payload;
    state.url=baseUrl()+'#'+payload;
    state.raw=raw;
    state.gz=Math.round(payload.length*3/4);
    state.meta=meta;
    renderMeter();
    setActions(state.url.length<=BUDGET);
  }).catch(function(e){
    state={payload:null,url:null,raw:raw,gz:0};
    renderMeter(); setActions(false);
    $('fitHint').textContent='Could not compress this input: '+(e&&e.message||e);
  });
}

function setActions(on){
  ['openBtn','copyBtn'].forEach(function(id){ $(id).disabled = !on || !keyReady; });
}

/* ---------------------------------------------------------- key management */
var keyReady = false;      /* a key is present AND matches this site's public key */

function renderKeyStatus(){
  var box=$('keyStatus'), hint=$('keyHint'), priv=storedKey();
  var row=function(ico,cls,title,body){
    return '<div class="chk"><div class="ico '+cls+'">'+ico+'</div><div><b>'+title+'</b>'+
           (body?'<span>'+body+'</span>':'')+'</div></div>';
  };
  /* Keys are only ever shown in the panel, never in the status text, so the
     same key cannot appear twice. */
  var clearPanel=hideKeyPanel;

  if(!haveCrypto()){
    keyReady=false; clearPanel();
    box.innerHTML=row('!','warn','Web Crypto unavailable',
      'Signing only works over https. Open this page from your site, not from a file.');
    hint.textContent=''; setActions(!!state.url); return;
  }

  if(!priv){
    keyReady=false; clearPanel();
    box.innerHTML=row('!','warn','No signing key on this device',
      PUBLIC_KEY
        ? 'Tap <b>Import key</b> and paste it from your password manager.'
        : 'Your site has no public key either. Tap <b>Create key</b> to start setup.');
    hint.innerHTML = PUBLIC_KEY ? '' : 'The README has the full setup steps.';
    setActions(!!state.url);
    return;
  }

  publicFromPrivate(priv).then(function(pub){
    hint.textContent='';
    if(!PUBLIC_KEY){
      keyReady=false;
      box.innerHTML=row('!','warn','Your site has no public key',
        'You have a key on this device, but your site does not know about it yet. Copy the line '+
        'below into <code>index.html</code>, then commit and push.');
      showKeyPanel({pub:pub});
    }else if(pub !== PUBLIC_KEY){
      keyReady=false;
      box.innerHTML=row('!','warn','This key does not match your site',
        'Your site trusts a different key, so anything you publish here would be refused. Either '+
        'import the matching key, or \u2014 if you forked this from someone else \u2014 replace the '+
        'public key in <code>index.html</code> with the one below.');
      showKeyPanel({pub:pub});
    }else{
      keyReady=true; clearPanel();
      box.innerHTML=row('\u2713','ok','Ready to publish',
        'Apps you publish are signed on this device and will run on your site. Nothing else will.');
    }
    setActions(!!state.url && state.url.length<=BUDGET);
  }).catch(function(){
    keyReady=false; clearPanel();
    box.innerHTML=row('!','warn','Stored key is unreadable',
      'Forget it and import a fresh copy from your backup.');
    setActions(!!state.url);
  });
}

function wireKeyButtons(){
  $('keyNew').onclick=function(){
    if(storedKey() && !confirm('This device already has a key. Replace it?\n\nIf you have not backed the old one up, '+
       'you will not be able to publish updates to apps signed with it.')) return;
    genKeyPair().then(function(kp){
      return Promise.all([exportPrivatePkcs8(kp.privateKey), exportPublicRaw(kp.publicKey)]);
    }).then(function(r){
      storeKey(r[0]);
      renderKeyStatus(); scheduleRecompute();
      showKeyPanel({priv:r[0], pub:r[1], isNew:true});
    }).catch(function(e){ alert('Could not generate a key: '+(e&&e.message||e)); });
  };

  $('keyImport').onclick=function(){
    var v=prompt('Paste your sideload private key:');
    if(!v) return;
    v=v.trim();
    importPrivate(v).then(function(){
      storeKey(v); renderKeyStatus(); scheduleRecompute(); toast('Key imported');
    }).catch(function(){ alert('That does not look like a sideload private key.'); });
  };

  $('keyExport').onclick=function(){
    if($('keyBackup').innerHTML){ hideKeyPanel(); return; }
    var priv=storedKey();
    if(!priv){ toast('No key on this device'); return; }
    publicFromPrivate(priv).then(function(pub){ showKeyPanel({priv:priv, pub:pub}); });
  };

  $('keyForget').onclick=function(){
    if(!storedKey()){ toast('No key on this device'); return; }
    if(!confirm('Forget the signing key on this device?\n\nSaved app data is untouched, and existing links keep '+
       'working. But you will not be able to publish or update until you import it again.')) return;
    forgetStoredKey(); hideKeyPanel(); renderKeyStatus();
    scheduleRecompute(); toast('Key forgotten');
  };
}

/* A read-only field with a Copy button. Used for both keys, so neither is
   stuck being select-and-copy by hand on a phone. */
var copyN = 0;
function copyBox(label, note, value){
  var id = '__cp' + (++copyN);
  return '<div style="margin-top:11px">'+
    '<b>'+esc(label)+'</b>'+(note ? ' <span style="color:var(--faint)">'+esc(note)+'</span>' : '')+
    '<textarea readonly rows="2" style="font-size:11px;margin-top:5px" id="'+id+'">'+esc(value)+'</textarea>'+
    '<button class="btn sm" data-copy="'+id+'">Copy</button></div>';
}
function wireCopyButtons(root){
  var bs = root.querySelectorAll('[data-copy]');
  for(var i=0;i<bs.length;i++){
    (function(b){
      b.onclick=function(){
        var t=document.getElementById(b.getAttribute('data-copy'));
        var done=function(){ b.textContent='Copied'; setTimeout(function(){ b.textContent='Copy'; },1600); };
        if(navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(t.value).then(done).catch(function(){ t.select(); b.textContent='Select and copy'; });
        else { t.select(); b.textContent='Select and copy'; }
      };
    })(bs[i]);
  }
}

/* The one place keys are displayed.
   opts.pub          public key, always shown
   opts.priv         private key, only when the user asked to see it
   opts.isNew        just created, so lead with "save it now"            */
function showKeyPanel(opts){
  var box=$('keyBackup'), html='';

  if(opts.priv){
    html += (opts.isNew ? '<b>New key created. Save it now.</b> ' : '<b>Your signing key.</b> ')+
      'Put the private key in your password manager. It is the only thing that can publish '+
      'updates, and it cannot be recovered.'+
      copyBox('Private key', 'secret, never share this', opts.priv);
  }
  html += copyBox('Public key',
                  "goes inside the quotes of var PUBLIC_KEY in index.html, then commit and push",
                  opts.pub);

  box.innerHTML = html;
  wireCopyButtons(box);
  var b=$('keyExport'); if(b) b.textContent='Hide key';
}
function hideKeyPanel(){
  $('keyBackup').innerHTML='';
  var b=$('keyExport'); if(b) b.textContent='Show key';
}

function exportAll(){
  var out={format:'sideload-backup', version:1, exportedAt:new Date().toISOString(), data:{}}, n=0;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && (k.lastIndexOf(NS_PREFIX,0)===0 || k.lastIndexOf(SELF_NS,0)===0)){
        out.data[k]=localStorage.getItem(k); n++;
      }
    }
  }catch(e){}
  if(!n){ toast('Nothing to export yet'); return; }
  download('sideload-backup-'+new Date().toISOString().slice(0,10)+'.json',
           JSON.stringify(out,null,2), 'application/json');
  toast('Exported '+n+' keys');
}

function importBackup(file){
  var r=new FileReader();
  r.onload=function(){
    var obj;
    try{ obj=JSON.parse(r.result); }catch(e){ alert('That is not valid JSON.'); return; }
    if(!obj || obj.format!=='sideload-backup' || !obj.data){
      alert('That does not look like a sideload backup.'); return;
    }
    var keys=Object.keys(obj.data);
    if(!keys.length){ alert('The backup is empty.'); return; }
    var clash=keys.filter(function(k){ try{ return localStorage.getItem(k)!==null; }catch(e){ return false; } });
    var msg='Import '+keys.length+' key'+(keys.length>1?'s':'')+' from '+
            (obj.exportedAt||'an unknown date')+'?';
    if(clash.length) msg+='\n\n'+clash.length+' existing key'+(clash.length>1?'s':'')+
                          ' will be overwritten. This cannot be undone — export first if unsure.';
    if(!confirm(msg)) return;
    var ok=0;
    keys.forEach(function(k){ try{ localStorage.setItem(k,obj.data[k]); ok++; }catch(e){} });
    toast('Imported '+ok+' keys');
    renderApps(); renderDataHint();
  };
  r.readAsText(file);
}

function loadFile(file){
  if(!file) return;
  var r=new FileReader();
  r.onload=function(){
    $('src').value=r.result;
    var base=(file.name||'').replace(/\.html?$/i,'');
    if(!$('title').value.trim()) $('title').value=guessTitle(r.result)||base;
    $('slug').dataset.touched=''; delete $('slug').dataset.touched;
    recompute();
    toast('Loaded '+file.name);
  };
  r.readAsText(file);
}

function showCompiler(){
  document.body.className='';
  document.title='sideload';
  $('root').innerHTML=compilerHTML();

  var src=$('src');
  src.addEventListener('input', scheduleRecompute);
  $('title').addEventListener('input', scheduleRecompute);
  $('slug').addEventListener('input', function(){ this.dataset.touched='1'; scheduleRecompute(); });

  /* drag & drop onto the textarea or the page */
  ['dragenter','dragover'].forEach(function(ev){
    src.addEventListener(ev,function(e){ e.preventDefault(); src.classList.add('drop'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    src.addEventListener(ev,function(){ src.classList.remove('drop'); });
  });
  document.addEventListener('dragover',function(e){ e.preventDefault(); });
  document.addEventListener('drop',function(e){
    e.preventDefault();
    src.classList.remove('drop');
    var f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) loadFile(f);
  });

  $('fileBtn').onclick=function(){ $('file').click(); };
  $('file').onchange=function(){ loadFile(this.files[0]); this.value=''; };
  $('clearBtn').onclick=function(){
    $('src').value=''; $('title').value=''; $('slug').value='';
    delete $('slug').dataset.touched; recompute();
  };
  /* For handing an app back to Claude, or moving it to another device.
     My apps > Edit loads the source into the box, then this copies it. */
  $('copyHtmlBtn').onclick=function(){
    var v=$('src').value;
    if(!v.trim()){ toast('Nothing to copy'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(v).then(function(){
        toast('Copied '+fmtBytes(te.encode(v).length)+' of HTML');
      }).catch(function(){ $('src').select(); toast('Select all and copy'); });
    } else { $('src').select(); toast('Select all and copy'); }
  };

  $('pasteBtn').onclick=function(){
    if(!navigator.clipboard || !navigator.clipboard.readText){ toast('Clipboard read is not available here'); return; }
    navigator.clipboard.readText().then(function(t){
      if(!t){ toast('Clipboard is empty'); return; }
      $('src').value=t; delete $('slug').dataset.touched; recompute(); toast('Pasted');
    }).catch(function(){ toast('Clipboard permission denied'); });
  };

  $('openBtn').onclick=function(){ if(state.url) location.href=state.url; };
  $('copyBtn').onclick=function(){
    if(!state.url) return;
    var done=function(){ toast('Link copied ('+fmtNum(state.url.length)+' chars)'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(state.url).then(done).catch(function(){
        prompt('Copy this link:', state.url);
      });
    } else prompt('Copy this link:', state.url);
  };
  $('expBtn').onclick=exportAll;
  $('impBtn').onclick=function(){ $('impFile').click(); };
  $('impFile').onchange=function(){ if(this.files[0]) importBackup(this.files[0]); this.value=''; };

  wireKeyButtons();
  renderKeyStatus();
  renderApps();
  renderDataHint();
  recompute();
}

/* ------------------------------------------------------------------ boot */
function boot(){
  if(typeof CompressionStream!=='function' || typeof DecompressionStream!=='function'){
    fatal('This browser is too old',
      'sideload needs the CompressionStream API \u2014 Safari 16.4 / iOS 16.4 or newer, or any current Chrome or Firefox.');
    return;
  }
  if(!haveCrypto()){
    fatal('Insecure context',
      'sideload checks app signatures with Web Crypto, which browsers only allow over https. '+
      'This page was not loaded that way, so nothing can be verified or run.');
    return;
  }
  var h=location.hash.replace(/^#/,'');
  if(h){ runApp(h); return; }
  showCompiler();
  /* Only in compiler mode. Choosing an app changes the part after the #, so
     reload to open it. The runner must not do this: if an app changes the #
     itself, the payload is already gone and reloading would lose it. */
  window.addEventListener('hashchange', function(){ location.reload(); });
}
boot();
})();
</script>
</body>
</html>
